[package]
name = "office2pdf-umya-spreadsheet"
version = "0.1.0"
authors = ["MathNya <umya.net.info@gmail.com>"]
repository = "https://github.com/developer0hye/umya-spreadsheet"
keywords = ["excel", "spreadsheet", "xlsx", "reader", "writer"]
license = "MIT"
readme = "README.md"
description = "Fork of umya-spreadsheet 2.3.3 carrying the reader fixes office2pdf depends on, until they are released upstream. Imported as `umya_spreadsheet`."
# Test workbooks and images stay in the repository; the published crate is the library.
exclude = ["tests/", "images/", "examples/"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes = "0.8.4"
ahash = "0.8.11"
base64 = "0.22.1"
byteorder = "1.5"
cbc = "0.1.2"
cfb = "0.10.0"
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }
encoding_rs = "0.8.35"
fancy-regex = "0.14.0"
getrandom = { version = "0.2.15" }
hmac = "0.12.1"
html_parser = "0.7.0"
imagesize = "0.14"
lazy_static = "1.5.0"
md-5 = "0.10.6"
regex = "1.11.1"
sha2 = "0.10.8"
thin-vec = "0.2.13"
thousands = "0.2.0"
quick-xml = { version = "0.41", features = ["serialize"] }
# zip 2.6 changed the reader types src/reader/driver.rs names; office2pdf locks 2.4.2.
zip = { version = ">=2.2.1, <2.6", default-features = false, features = ["deflate"] }

[lib]
# Keep the upstream import path for code written against umya-spreadsheet.
name = "umya_spreadsheet"
doctest = false

[features]
js = ["getrandom/js"]
